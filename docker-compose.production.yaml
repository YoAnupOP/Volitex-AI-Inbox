x-base: &base
  # Set this to a Volitex-owned OCI image pinned by digest. Never use a tag,
  # especially not `latest`, for a paying-client deployment.
  image: ${VOLITEX_IMAGE:?Set VOLITEX_IMAGE to a Volitex image digest}
  env_file: .env

services:

  rails:
    <<: *base
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:3000/api >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5

  sidekiq:
    <<: *base
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped
