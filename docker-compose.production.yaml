x-base: &base
  # Set this to a Volitex-owned OCI image pinned by digest. Never use a tag,
  # especially not `latest`, for a paying-client deployment.
  image: ${VOLITEX_IMAGE:?Set VOLITEX_IMAGE to a Volitex image digest}
  env_file: .env
  volumes:
    - volitex_storage:/app/storage

services:
  migrate:
    <<: *base
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:chatwoot_prepare']
    restart: 'no'

  rails:
    <<: *base
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://127.0.0.1:3000/api >/dev/null',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  sidekiq:
    <<: *base
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  campaign-worker:
    <<: *base
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq_campaigns.yml']
    cpus: '1.0'
    mem_limit: 1536m
    healthcheck:
      test: ['CMD', 'bundle', 'exec', 'ruby', 'script/production/campaign_worker_health.rb']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  volitex_storage:
