name: Verify non-production candidate

on:
  push:
    branches: [codex/whatsapp-interactive-quick-menus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable production entrypoint behavior
        run: bash script/production/specs/entrypoint_test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build exact candidate without publishing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: volitex-candidate:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=candidate-amd64
          cache-to: type=gha,mode=max,scope=candidate-amd64
      - name: Record candidate identity
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "volitex-candidate:$GITHUB_SHA" --format 'Local image ID: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify isolated production boot
        run: bash script/production/verify_candidate.sh "volitex-candidate:$GITHUB_SHA" "$GITHUB_SHA"
      - name: Audit candidate image runtime packages
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-audit"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$RUNNER_TEMP/candidate-audit:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /out/candidate-vulnerabilities.json "volitex-candidate:$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: candidate-image-vulnerabilities
          path: ${{ runner.temp }}/candidate-audit/candidate-vulnerabilities.json
