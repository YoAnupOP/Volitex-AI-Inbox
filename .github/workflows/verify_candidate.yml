name: Verify non-production candidate

on:
  push:
    branches: [master, codex/whatsapp-interactive-quick-menus, 'codex/upstream-maintenance-*', 'codex/integrated-release-candidate-*', 'codex/pre-client-readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual n8n node and module restrictions
        env:
          N8N_ASSESSMENT_IMAGE: n8nio/n8n@sha256:a18edcf018198b33b5488fb47ededafe11e0b10d28f65b9535b7c447c9ce3b2c
        run: |
          docker pull "$N8N_ASSESSMENT_IMAGE"
          docker run --rm --network none \
            --env-file deployment/n8n/runtime-policy.env \
            -e N8N_CUSTOM_EXTENSIONS=/opt/volitex/n8n-custom \
            -v "$PWD/deployment/n8n/custom:/opt/volitex/n8n-custom:ro" \
            -v "$PWD/script/production/verify_n8n_policy.cjs:/probe.cjs:ro" \
            --entrypoint node "$N8N_ASSESSMENT_IMAGE" /probe.cjs
          docker run --rm --network none \
            -v "$PWD/script/production/specs/n8n_core_boundaries.cjs:/probe.cjs:ro" \
            --entrypoint node "$N8N_ASSESSMENT_IMAGE" --test /probe.cjs

  n8n-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production monitor failure handling
        run: node --test script/production/specs/monitor.test.cjs
      - name: Verify authenticated Inbox reply contract
        run: node --test script/production/specs/n8n_reply.test.cjs

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable production entrypoint behavior
        run: bash script/production/specs/entrypoint_test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build exact candidate without publishing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: volitex-candidate:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=candidate-amd64
          cache-to: type=gha,mode=max,scope=candidate-amd64
      - name: Record candidate identity
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "volitex-candidate:$GITHUB_SHA" --format 'Local image ID: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify isolated production boot
        run: bash script/production/verify_candidate.sh "volitex-candidate:$GITHUB_SHA" "$GITHUB_SHA"
      - name: Verify private n8n upgrade, ownership and interrupted reply recovery
        run: python3 script/production/verify_n8n_acceptance.py --app-image "volitex-candidate:$GITHUB_SHA" --source-sha "$GITHUB_SHA"
      - name: Audit candidate image runtime packages
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-audit"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$RUNNER_TEMP/candidate-audit:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --exit-code 0 \
            --format json --output /out/candidate-vulnerabilities.json "volitex-candidate:$GITHUB_SHA"
          jq '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map({severity: .[0].Severity, count: length})' "$RUNNER_TEMP/candidate-audit/candidate-vulnerabilities.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$RUNNER_TEMP/candidate-audit/candidate-vulnerabilities.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: candidate-image-vulnerabilities
          path: ${{ runner.temp }}/candidate-audit/candidate-vulnerabilities.json
