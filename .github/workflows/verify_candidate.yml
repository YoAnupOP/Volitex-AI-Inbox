name: Verify non-production candidate

on:
  push:
    branches: [master, codex/whatsapp-interactive-quick-menus, 'codex/upstream-maintenance-*', 'codex/integrated-release-candidate-*', 'codex/pre-client-readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the maintained n8n runtime
        uses: docker/build-push-action@v6
        with:
          context: deployment/n8n
          file: deployment/n8n/hardened/Dockerfile
          load: true
          push: false
          tags: volitex-n8n:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=n8n-runtime-amd64
          cache-to: type=gha,mode=max,scope=n8n-runtime-amd64
      - name: Build the maintained n8n database
        uses: docker/build-push-action@v6
        with:
          context: deployment/n8n/hardened
          file: deployment/n8n/hardened/Postgres.Dockerfile
          load: true
          push: false
          tags: volitex-n8n-postgres:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=n8n-postgres-amd64
          cache-to: type=gha,mode=max,scope=n8n-postgres-amd64
      - name: Build the maintained n8n queue
        uses: docker/build-push-action@v6
        with:
          context: deployment/n8n/hardened
          file: deployment/n8n/hardened/Valkey.Dockerfile
          load: true
          push: false
          tags: volitex-n8n-valkey:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=n8n-valkey-amd64
          cache-to: type=gha,mode=max,scope=n8n-valkey-amd64
      - name: Build the maintained Inbox pgvector database
        uses: docker/build-push-action@v6
        with:
          context: deployment/production
          file: deployment/production/InboxPostgres.Dockerfile
          load: true
          push: false
          tags: volitex-inbox-postgres:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=inbox-postgres-amd64
          cache-to: type=gha,mode=max,scope=inbox-postgres-amd64
      - name: Verify patched source and actual runtime behavior
        run: |
          image="volitex-n8n:$GITHUB_SHA"
          test "$(docker run --rm --network none --entrypoint cat "$image" /opt/volitex/security/source-sha)" = "$GITHUB_SHA"
          for service in n8n-postgres n8n-valkey inbox-postgres; do
            test "$(docker run --rm --network none --entrypoint cat "volitex-$service:$GITHUB_SHA" "/opt/volitex/${service#n8n-}-source-sha")" = "$GITHUB_SHA"
          done
          test "$(docker run --rm --network none --entrypoint su-exec "volitex-n8n-postgres:$GITHUB_SHA" postgres id -u)" = 70
          mkdir -p "$RUNNER_TEMP/n8n-audit"
          docker run --rm --network none \
            -v "$PWD/deployment/n8n/hardened/verify-runtime.mjs:/verify-runtime.mjs:ro" \
            --entrypoint node "$image" /verify-runtime.mjs > "$RUNNER_TEMP/n8n-audit/source-verification.json"
          docker run --rm --network none \
            --env-file deployment/n8n/runtime-policy.env \
            -e N8N_CUSTOM_EXTENSIONS=/opt/volitex/n8n-custom \
            -v "$PWD/script/production/verify_n8n_policy.cjs:/probe.cjs:ro" \
            --entrypoint node "$image" /probe.cjs
          for spec in n8n_core_boundaries.cjs n8n_hardened_runtime.test.cjs; do
            docker run --rm --network none \
              -v "$PWD/script/production/specs/$spec:/probe.cjs:ro" \
              --entrypoint node "$image" --test /probe.cjs
          done
      - name: Audit every runtime package and retain backport evidence
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$RUNNER_TEMP/n8n-audit:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --exit-code 0 \
            --format json --output /out/n8n-vulnerabilities.json "volitex-n8n:$GITHUB_SHA"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/script/production/audit_n8n_runtime.mjs:/audit.mjs:ro" \
            -v "$RUNNER_TEMP/n8n-audit:/out" --entrypoint node "volitex-n8n:$GITHUB_SHA" \
            /audit.mjs /out/n8n-vulnerabilities.json /out/source-verification.json /out/security-summary.json "$GITHUB_SHA" "volitex-n8n:$GITHUB_SHA"
          cat "$RUNNER_TEMP/n8n-audit/security-summary.json" >> "$GITHUB_STEP_SUMMARY"
          for service in n8n-postgres n8n-valkey inbox-postgres; do
            image="volitex-$service:$GITHUB_SHA"
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
              --volume "$RUNNER_TEMP/n8n-audit:/out" \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --exit-code 0 --format json --output "/out/$service.json" "$image"
            jq -e --arg image "$image" '.ArtifactName == $image' "$RUNNER_TEMP/n8n-audit/$service.json"
            jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$RUNNER_TEMP/n8n-audit/$service.json"
          done
      - name: Save the checked image for acceptance and publication
        run: |
          docker save "volitex-n8n:$GITHUB_SHA" "volitex-n8n-postgres:$GITHUB_SHA" "volitex-n8n-valkey:$GITHUB_SHA" "volitex-inbox-postgres:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/n8n-runtime.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum n8n-runtime.tar.gz > n8n-runtime.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-runtime-image
          path: |
            ${{ runner.temp }}/n8n-runtime.tar.gz
            ${{ runner.temp }}/n8n-runtime.tar.gz.sha256
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-image-vulnerabilities
          path: ${{ runner.temp }}/n8n-audit
          if-no-files-found: error

  n8n-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify acceptance cleanup ownership
        run: python3 script/production/specs/n8n_acceptance/test_harness.py
      - name: Verify security gate rejects unverified findings
        run: node --test script/production/specs/n8n_security_gate.test.cjs
      - name: Verify production monitor failure handling
        run: node --test script/production/specs/monitor.test.cjs
      - name: Verify authenticated Inbox reply contract
        run: node --test script/production/specs/n8n_reply.test.cjs

  candidate:
    needs: n8n-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable production entrypoint behavior
        run: bash script/production/specs/entrypoint_test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build exact candidate without publishing
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: volitex-candidate:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=candidate-amd64
          cache-to: type=gha,mode=max,scope=candidate-amd64
      - name: Record candidate identity
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "volitex-candidate:$GITHUB_SHA" --format 'Local image ID: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: n8n-runtime-image
          path: ${{ runner.temp }}/n8n-runtime
      - name: Load the already checked n8n image
        run: |
          cd "$RUNNER_TEMP/n8n-runtime"
          sha256sum -c n8n-runtime.tar.gz.sha256
          gzip -dc n8n-runtime.tar.gz | docker load
      - name: Verify isolated production boot
        run: bash script/production/verify_candidate.sh "volitex-candidate:$GITHUB_SHA" "$GITHUB_SHA" "volitex-inbox-postgres:$GITHUB_SHA" "volitex-n8n-valkey:$GITHUB_SHA"
      - name: Verify private n8n upgrade, ownership and interrupted reply recovery
        run: python3 script/production/verify_n8n_acceptance.py --app-image "volitex-candidate:$GITHUB_SHA" --app-postgres-image "volitex-inbox-postgres:$GITHUB_SHA" --source-sha "$GITHUB_SHA" --n8n-image "volitex-n8n:$GITHUB_SHA" --n8n-postgres-image "volitex-n8n-postgres:$GITHUB_SHA" --n8n-valkey-image "volitex-n8n-valkey:$GITHUB_SHA"
      - name: Audit candidate image runtime packages
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-audit"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$RUNNER_TEMP/candidate-audit:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --exit-code 0 \
            --format json --output /out/candidate-vulnerabilities.json "volitex-candidate:$GITHUB_SHA"
          jq '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map({severity: .[0].Severity, count: length})' "$RUNNER_TEMP/candidate-audit/candidate-vulnerabilities.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$RUNNER_TEMP/candidate-audit/candidate-vulnerabilities.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: candidate-image-vulnerabilities
          path: ${{ runner.temp }}/candidate-audit/candidate-vulnerabilities.json
