name: Publish Volitex Inbox image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image-name
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/volitex-ai-inbox" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image-name.outputs.name }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
      - name: Publish immutable deployment reference
        run: |
          echo "${{ steps.image-name.outputs.name }}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
