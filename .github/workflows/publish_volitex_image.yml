name: Publish Volitex AI Inbox image

# The founder authorizes automatic publication of verified master commits.
# This publishes an image; it never deploys to a server.
on:
  workflow_run:
    workflows: [Verify non-production candidate, Verify campaign lifecycle, Verify migration compatibility, Run Chatwoot CE spec]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full verified integrated commit SHA
        required: true
        type: string
      authorization:
        description: Enter PUBLISH_CANDIDATE to authorize GHCR publication
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  gates:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.authorization == 'PUBLISH_CANDIDATE') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Resolve exact source and all required gates
        id: check
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --limit 100 \
            --json workflowName,conclusion,status,createdAt > "$RUNNER_TEMP/gates.json"
          ready=true
          for workflow in 'Verify non-production candidate' 'Verify campaign lifecycle' 'Verify migration compatibility' 'Run Chatwoot CE spec'; do
            if ! jq -e --arg workflow "$workflow" \
              '[.[] | select(.workflowName == $workflow)] | sort_by(.createdAt) | last | .status == "completed" and .conclusion == "success"' \
              "$RUNNER_TEMP/gates.json"; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            echo 'Publication waits for all four exact-source gates.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$EVENT_NAME" != workflow_dispatch ]]
          fi

  publish:
    needs: gates
    if: needs.gates.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: volitex-image-${{ needs.gates.outputs.source_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.source_sha }}
      - name: Require exact source and completed candidate gates
        env:
          SOURCE_SHA: ${{ needs.gates.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --limit 100 \
            --json workflowName,conclusion,status,createdAt > "$RUNNER_TEMP/gates.json"
          for workflow in 'Verify non-production candidate' 'Verify campaign lifecycle' 'Verify migration compatibility' 'Run Chatwoot CE spec'; do
            jq -e --arg workflow "$workflow" \
              '[.[] | select(.workflowName == $workflow)] | sort_by(.createdAt) | last | .status == "completed" and .conclusion == "success"' \
              "$RUNNER_TEMP/gates.json"
          done
      - uses: docker/setup-buildx-action@v3
      - id: image-name
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/volitex-ai-inbox" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an already published exact-source image
        id: existing
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/publication-audit"
          if result="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>&1)"; then
            [[ "$result" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown' <<< "$result"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - name: Build locally before publication
        if: steps.existing.outputs.exists == 'false'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
          build-args: GIT_SHA=${{ needs.gates.outputs.source_sha }}
          cache-from: type=gha,scope=candidate-amd64
      - name: Boot and recover the exact image
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
          SOURCE_SHA: ${{ needs.gates.outputs.source_sha }}
        run: bash script/production/verify_candidate.sh "$IMAGE" "$SOURCE_SHA"
      - name: Scan the same image before publication
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/publication-audit"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$RUNNER_TEMP/publication-audit:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --exit-code 0 --format json --output /out/image.json "$IMAGE"
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$RUNNER_TEMP/publication-audit/image.json"
      - name: Publish the tested image without rebuilding
        if: steps.existing.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
          NAME: ${{ steps.image-name.outputs.name }}
        run: |
          docker push "$IMAGE"
      - name: Verify registry source and record the immutable image
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}:${{ needs.gates.outputs.source_sha }}
          NAME: ${{ steps.image-name.outputs.name }}
          SOURCE_SHA: ${{ needs.gates.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          marker="$(docker run --rm --network none --entrypoint cat "$NAME@$digest" /app/.git_sha)"
          test "$marker" = "$SOURCE_SHA"
          echo "$NAME@$digest" | tee "$RUNNER_TEMP/publication-audit/immutable-reference.txt"
          echo "Source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/publication-audit/immutable-reference.txt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$SOURCE_SHA" ]]; then
            docker buildx imagetools create --tag "$NAME:master" "$NAME@$digest"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-evidence
          path: ${{ runner.temp }}/publication-audit
