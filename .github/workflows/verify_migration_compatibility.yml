name: Verify migration compatibility

on:
  push:
    branches: [codex/whatsapp-interactive-quick-menus, 'codex/integrated-release-candidate-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test_primary_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test_deterministic_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test_salt_cccccccccccccccccccccccccccccccccccccccccccccccccc
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve supported HairTrigger patch
        run: |
          sudo apt-get update && sudo apt-get install -y libvips-dev
          bundle install --jobs 4
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Fresh migration and schema dump
        run: |
          POSTGRES_DATABASE=candidate_fresh bundle exec rails db:create db:migrate db:schema:dump
          POSTGRES_DATABASE=candidate_fresh bundle exec rails db:migrate:down VERSION=20261017000000
          POSTGRES_DATABASE=candidate_fresh bundle exec rails db:migrate:up VERSION=20261017000000
          POSTGRES_DATABASE=candidate_fresh bundle exec rails db:migrate:down VERSION=20261010000000
          POSTGRES_DATABASE=candidate_fresh bundle exec rails runner 'raise if ActiveRecord::Base.connection.table_exists?(:quick_menus)'
          POSTGRES_DATABASE=candidate_fresh bundle exec rails db:migrate:up VERSION=20261010000000
      - name: Upgrade supplied prior schema
        run: |
          git fetch origin 452f849bc5d2c45b682dcc1e1e4d44ca43c102a9
          git show 452f849bc5d2c45b682dcc1e1e4d44ca43c102a9:db/schema.rb > /tmp/prior-schema.rb
          POSTGRES_DATABASE=candidate_upgrade SCHEMA=/tmp/prior-schema.rb bundle exec rails db:create db:schema:load
          POSTGRES_DATABASE=candidate_upgrade bundle exec rails db:migrate db:schema:dump
          POSTGRES_DATABASE=candidate_upgrade bundle exec rails runner 'connection=ActiveRecord::Base.connection; raise unless connection.table_exists?(:quick_menus); raise unless connection.table_exists?(:campaign_recipients); raise unless connection.table_exists?(:campaign_dispatch_slots); raise unless connection.foreign_keys(:quick_menus).any? { |key| key.to_table == "accounts" }; raise unless connection.indexes(:quick_menus).any? { |index| index.columns == ["account_id"] }; raise unless connection.check_constraints(:quick_menus).size == 2; puts "Quick Menu schema constraints verified"'
      - name: Security and production-critical specs on unseeded database
        run: |
          bundle exec bundle-audit check --update
          bundle exec rails db:create db:schema:load
          bundle exec rspec spec/models/quick_menu_spec.rb spec/policies/quick_menu_policy_spec.rb spec/requests/api/v1/accounts/quick_menus_spec.rb spec/requests/api/v1/accounts/quick_menu_sending_spec.rb spec/controllers/webhooks/whatsapp_controller_spec.rb spec/jobs/webhooks/whatsapp_events_job_spec.rb spec/jobs/agent_bots/webhook_job_spec.rb spec/lib/webhooks/trigger_spec.rb spec/services/conversations/automation_ownership_service_spec.rb spec/controllers/webhooks/meta_controller_spec.rb spec/models/application_record_external_credentials_encryption_spec.rb spec/services/instagram/refresh_oauth_token_service_spec.rb spec/services/conversations/message_window_service_spec.rb spec/services/whatsapp/providers/base_service_spec.rb spec/services/whatsapp/providers/whatsapp_cloud_service_spec.rb spec/services/whatsapp/providers/whatsapp360_dialog_service_spec.rb spec/services/whatsapp/incoming_message_whatsapp_cloud_service_spec.rb --format progress --format json --out tmp/production_critical_results.json
          bundle exec rspec spec/lib/volitex_production_configuration_spec.rb --format progress --format json --out tmp/runtime_guard_results.json
          bundle exec rspec spec/controllers/api/v1/accounts/conversations/messages_controller_spec.rb --example 'Volitex n8n AgentBot' --format progress --format json --out tmp/n8n_api_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-verification
          path: |
            Gemfile
            Gemfile.lock
            db/schema.rb
            tmp/production_critical_results.json
            tmp/runtime_guard_results.json
            tmp/n8n_api_results.json
