# Production n8n deployment for Volitex. Coolify supplies every ${...} value
# from its environment-variable UI. Do not add a repository .env.n8n file.
x-n8n: &n8n
  image: ${N8N_IMAGE:?Set N8N_IMAGE to an immutable n8n image digest}
  restart: unless-stopped
  environment:
    DB_TYPE: ${DB_TYPE:?Set DB_TYPE}
    DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:?Set DB_POSTGRESDB_HOST}
    DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:?Set DB_POSTGRESDB_PORT}
    DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:?Set DB_POSTGRESDB_DATABASE}
    DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:?Set DB_POSTGRESDB_USER}
    DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?Set DB_POSTGRESDB_PASSWORD}
    DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA:?Set DB_POSTGRESDB_SCHEMA}
    DB_POSTGRESDB_POOL_SIZE: ${DB_POSTGRESDB_POOL_SIZE:?Set DB_POSTGRESDB_POOL_SIZE}
    EXECUTIONS_MODE: ${EXECUTIONS_MODE:?Set EXECUTIONS_MODE}
    QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST:?Set QUEUE_BULL_REDIS_HOST}
    QUEUE_BULL_REDIS_PORT: ${QUEUE_BULL_REDIS_PORT:?Set QUEUE_BULL_REDIS_PORT}
    QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:?Set QUEUE_BULL_REDIS_DB}
    QUEUE_BULL_REDIS_PASSWORD: ${QUEUE_BULL_REDIS_PASSWORD:?Set QUEUE_BULL_REDIS_PASSWORD}
    QUEUE_BULL_PREFIX: ${QUEUE_BULL_PREFIX:?Set QUEUE_BULL_PREFIX}
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:?Set N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
    N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:?Set N8N_DEFAULT_BINARY_DATA_MODE}
    N8N_HOST: ${N8N_HOST:?Set N8N_HOST}
    N8N_PORT: ${N8N_PORT:?Set N8N_PORT}
    N8N_PROTOCOL: ${N8N_PROTOCOL:?Set N8N_PROTOCOL}
    N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:?Set N8N_LISTEN_ADDRESS}
    N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?Set N8N_EDITOR_BASE_URL}
    N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL}
    N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:?Set N8N_PROXY_HOPS}
    N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:?Set N8N_SECURE_COOKIE}
    N8N_MFA_ENABLED: ${N8N_MFA_ENABLED:?Set N8N_MFA_ENABLED}
    N8N_OAUTH_BROWSER_BINDING: ${N8N_OAUTH_BROWSER_BINDING:?Set N8N_OAUTH_BROWSER_BINDING}
    N8N_INVITE_LINKS_EMAIL_ONLY: ${N8N_INVITE_LINKS_EMAIL_ONLY:?Set N8N_INVITE_LINKS_EMAIL_ONLY}
    N8N_PUBLIC_API_DISABLED: ${N8N_PUBLIC_API_DISABLED:?Set N8N_PUBLIC_API_DISABLED}
    N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:?Set N8N_DIAGNOSTICS_ENABLED}
    N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:?Set N8N_PERSONALIZATION_ENABLED}
    N8N_TEMPLATES_ENABLED: ${N8N_TEMPLATES_ENABLED:?Set N8N_TEMPLATES_ENABLED}
    N8N_COMMUNITY_PACKAGES_ENABLED: ${N8N_COMMUNITY_PACKAGES_ENABLED:?Set N8N_COMMUNITY_PACKAGES_ENABLED}
    N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:?Set N8N_BLOCK_ENV_ACCESS_IN_NODE}
    N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: ${N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES:?Set N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES}
    N8N_RESTRICT_FILE_ACCESS_TO: ${N8N_RESTRICT_FILE_ACCESS_TO:?Set N8N_RESTRICT_FILE_ACCESS_TO}
    N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED:?Set N8N_SSRF_PROTECTION_ENABLED}
    N8N_SSRF_BLOCKED_IP_RANGES: ${N8N_SSRF_BLOCKED_IP_RANGES:?Set N8N_SSRF_BLOCKED_IP_RANGES}
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: ${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:?Set OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS}
    QUEUE_HEALTH_CHECK_ACTIVE: ${QUEUE_HEALTH_CHECK_ACTIVE:?Set QUEUE_HEALTH_CHECK_ACTIVE}
    QUEUE_HEALTH_CHECK_PORT: ${QUEUE_HEALTH_CHECK_PORT:?Set QUEUE_HEALTH_CHECK_PORT}
    N8N_WORKER_SERVER_ADDRESS: ${N8N_WORKER_SERVER_ADDRESS:?Set N8N_WORKER_SERVER_ADDRESS}
    EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:?Set EXECUTIONS_DATA_PRUNE}
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:?Set EXECUTIONS_DATA_MAX_AGE}
    EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:?Set EXECUTIONS_DATA_PRUNE_MAX_COUNT}
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:?Set EXECUTIONS_DATA_SAVE_ON_SUCCESS}
    EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:?Set EXECUTIONS_DATA_SAVE_ON_ERROR}
    EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: ${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:?Set EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS}
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE}
    TZ: ${TZ:?Set TZ}
    N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:?Set N8N_LOG_LEVEL}
    N8N_LOG_OUTPUT: ${N8N_LOG_OUTPUT:?Set N8N_LOG_OUTPUT}
    N8N_LOG_FORMAT: ${N8N_LOG_FORMAT:?Set N8N_LOG_FORMAT}
    N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:?Set N8N_EMAIL_MODE}
    N8N_SMTP_HOST: ${N8N_SMTP_HOST:?Set N8N_SMTP_HOST}
    N8N_SMTP_PORT: ${N8N_SMTP_PORT:?Set N8N_SMTP_PORT}
    N8N_SMTP_USER: ${N8N_SMTP_USER:?Set N8N_SMTP_USER}
    N8N_SMTP_PASS: ${N8N_SMTP_PASS:?Set N8N_SMTP_PASS}
    N8N_SMTP_SSL: ${N8N_SMTP_SSL:?Set N8N_SMTP_SSL}
    N8N_SMTP_STARTTLS: ${N8N_SMTP_STARTTLS:?Set N8N_SMTP_STARTTLS}
    N8N_SMTP_SENDER: ${N8N_SMTP_SENDER:?Set N8N_SMTP_SENDER}

services:
  n8n-postgres:
    image: ${N8N_POSTGRES_IMAGE:?Set N8N_POSTGRES_IMAGE to an immutable PostgreSQL image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:?Set DB_POSTGRESDB_DATABASE}
      POSTGRES_USER: ${DB_POSTGRESDB_USER:?Set DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?Set DB_POSTGRESDB_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  n8n-valkey:
    image: ${N8N_VALKEY_IMAGE:?Set N8N_VALKEY_IMAGE to an immutable Valkey image digest}
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${QUEUE_BULL_REDIS_PASSWORD:?Set QUEUE_BULL_REDIS_PASSWORD}
    command: ['sh', '-c', 'exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"']
    volumes:
      - n8n_valkey_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli --no-auth-warning -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  n8n-main:
    <<: *n8n
    command: ['n8n', 'start']
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-valkey:
        condition: service_healthy
    expose:
      - '5678'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 5

  n8n-worker:
    <<: *n8n
    command: ['n8n', 'worker', '--concurrency=${N8N_WORKER_CONCURRENCY:?Set N8N_WORKER_CONCURRENCY}']
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-valkey:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  n8n_postgres_data:
  n8n_valkey_data:
