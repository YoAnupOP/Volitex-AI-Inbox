# Production n8n deployment for Volitex. Use one immutable digest for BOTH
# services. Do not add PostgreSQL or Redis containers here: both are managed,
# external services with separate n8n-only credentials.
x-n8n: &n8n
  image: ${N8N_IMAGE:?Set N8N_IMAGE to an immutable n8n image digest}
  env_file: .env.n8n
  restart: unless-stopped

services:
  n8n-main:
    <<: *n8n
    command: ['n8n', 'start']
    expose:
      - '5678'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 5

  n8n-worker:
    <<: *n8n
    command: ['n8n', 'worker', '--concurrency=5']
